    <meta charset="utf-8" />

    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style>
      body { background: var(--bg); color: var(--text); }
      .disp { font-family: 'Space Grotesk', 'Pretendard Variable', sans-serif; letter-spacing: -0.03em; font-weight: 700; }
      .num { font-family: 'Space Grotesk', 'Pretendard Variable', sans-serif; font-variant-numeric: tabular-nums; }
      .panel { border: 1px solid var(--line); border-radius: 18px; background: var(--bg-soft); padding: 32px 24px; text-align: center; }
      .icon { font-size: 40px; line-height: 1; }
      .lead { font-size: 15px; line-height: 1.8; color: var(--text-dim); margin-top: 12px; word-break: keep-all; }
      .lead b { color: var(--text); }
      .order-box { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.7; color: var(--text-dim); margin-top: 18px; word-break: keep-all; }
      .order-box .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
      .order-box .row .v { color: var(--text); text-align: right; min-width: 0; overflow-wrap: anywhere; }
      .order-box .row.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; font-weight: 800; }
      .order-box .row.total .v { color: var(--accent-deep); font-family: 'Space Grotesk', sans-serif; font-size: 18px; }
      .btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
      .btn-row a, .btn-row button { padding: 12px 18px; border-radius: 999px; font-weight: 700; font-size: 14.5px; border: 1px solid var(--line); color: var(--text); text-decoration: none; background: var(--bg); }
      .btn-row .prime { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
      .spin { width: 28px; height: 28px; border-radius: 999px; border: 3px solid var(--line); border-top-color: var(--accent); margin: 0 auto; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    </style>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WZWCZTKJ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="bg-blobs" aria-hidden="true"></div>

    <header class="container-x pt-8 pb-2 flex items-center justify-between gap-4">
      <a href="/" class="inline-flex items-center gap-2 text-sm" style="color: var(--text-dim)">
        <span style="width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#FF623D,#C9FF4A);display:inline-block"></span>
        <span class="font-semibold" style="color: var(--text)">NOAH</span>
        <span style="color: var(--text-quiet)">· 결제 결과</span>
      </a>
    </header>

    <main class="container-x py-10 mx-auto" style="max-width:36rem">
      <section class="panel" id="box" aria-live="polite">
        <div class="spin" aria-hidden="true"></div>
        <p class="lead">결제 결과를 확인하고 있습니다…</p>
        <noscript><p class="lead">결제 결과를 보려면 자바스크립트를 켜 주세요. 문의 010-6658-6482</p></noscript>
      </section>
    </main>

    <footer class="container-x py-10 text-center text-xs leading-relaxed" style="color: var(--text-quiet)">
      <p>NOAH · 노아홈페이지 — 상호: 노아데이터베이스 · 대표: 채희준 · 사업자등록번호: 224-73-00560 · 통신판매업 신고번호: 제2026-인천서해-1228호</p>
      <p class="mt-1"><a href="/terms" class="underline">이용약관 · 환불 규정</a> · <a href="/privacy" class="underline">개인정보처리방침</a> · 문의 <a href="tel:01066586482" class="underline">010-6658-6482</a></p>
    </footer>

    <script>
      // 결제창 레이어(iframe) 안에서 열렸다면 전체 창으로 옮깁니다.
      if (window.top !== window.self) { try { window.top.location.href = location.href; } catch (_) {} }

      const TEL = '010-6658-6482';
      const telLink = `<a href="tel:${TEL.replace(/-/g, '')}">전화 ${TEL}</a>`;
      const box = document.getElementById('box');
      const won = (n) => '₩' + Number(n).toLocaleString('ko-KR');
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const orderId = new URLSearchParams(location.search).get('o') || '';

      function summary(d) {
        return `<div class="order-box">
          <div class="row"><span>주문번호</span><span class="v num">${esc(d.orderId)}</span></div>
          ${(d.items || []).map(i => `<div class="row"><span>${esc(i.name)}</span><span class="v num">${i.price ? won(i.price) : '무료'}</span></div>`).join('')}
          <div class="row total"><span>결제 금액 (VAT 포함)</span><span class="v">${won(d.amount)}</span></div>
        </div>`;
      }
      function show(icon, title, body, extra = '') {
        box.innerHTML = `<div class="icon" aria-hidden="true">${icon}</div><h1 class="disp text-2xl mt-4">${title}</h1><p class="lead">${body}</p>${extra}`;
      }

      // 서버가 실제 승인(paid)을 확인한 경우에만 호출됩니다.
      function paid(d) {
        const test = d.sandbox ? '<p class="lead" style="color:#D93025;font-weight:700">테스트 결제(나이스페이 샌드박스)입니다. 실제로 청구되지 않았습니다.</p>' : '';
        show('🎉', d.sandbox ? '결제가 완료되었습니다 (테스트)' : '결제가 완료되었습니다',
          `주문해 주셔서 감사합니다. <b>영업일 1일 안에</b> 주문하실 때 남겨 주신 연락처로 착수 안내와 사전 정보 시트 링크를 보내드립니다.`,
          test + summary(d) + `
          <div class="btn-row"><a class="prime" href="/">홈으로</a><a href="/process">제작 과정 보기</a>${telLink}</div>`);
        try { sessionStorage.removeItem('noah_checkout_v2'); } catch (_) {}
        // GA4 purchase — 서버가 paid로 확인한 뒤, 주문번호당 한 번만
        let sent = false;
        try { sent = localStorage.getItem('noah_ga_purchase:' + d.orderId) === '1'; } catch (_) {}
        if (!sent && typeof gtag === 'function') {
          // 샌드박스 결제는 debug_mode 로 보내 GA4 DebugView에서만 확인 (개발자 트래픽 필터로 보고서에서 제외 가능)
          gtag('event', 'purchase', { transaction_id: d.orderId, value: d.amount, currency: 'KRW', ...(d.sandbox ? { debug_mode: true } : {}),
            items: (d.items || []).map(i => ({ item_id: i.key, item_name: i.name, price: i.price, quantity: 1 })) });
          try { localStorage.setItem('noah_ga_purchase:' + d.orderId, '1'); } catch (_) {}
        }
      }

      async function load(tries) {
        if (!/^NO-\d{6}-[A-Z0-9]{10}$/.test(orderId)) return notFound();
        let d = null;
        try {
          const r = await fetch(`/api/order/${encodeURIComponent(orderId)}/status`, { cache: 'no-store' });
          d = await r.json();
        } catch (_) {}
        if (!d) return show('⚠️', '결제 결과를 불러오지 못했습니다', `잠시 후 새로고침해 주세요. 계속 안 되면 ${TEL} 로 연락 주세요.`,
          `<div class="btn-row"><button type="button" class="prime" onclick="location.reload()">새로고침</button>${telLink}</div>`);
        if (d.status === 'paid') return paid(d);
        if (d.status === 'pending' && tries < 5) return setTimeout(() => load(tries + 1), 2000);
        if (d.status === 'pending') return show('🔎', '결제를 아직 확인하지 못했습니다',
          `<b>카드 승인 문자를 받으셨다면 다시 결제하지 마시고</b> ${TEL} 로 연락 주세요. 확인해 바로 처리해 드립니다. 승인 문자가 없다면 결제가 되지 않은 것이니 결제 페이지에서 다시 시도해 주세요.`,
          `<div class="btn-row"><a class="prime" href="/checkout">결제 페이지로</a><button type="button" onclick="location.reload()">새로고침</button>${telLink}</div>`);
        if (d.status === 'check') return show('🔎', '결제 확인이 필요합니다',
          `결제 처리 중 응답이 늦거나 확인이 필요한 부분이 있어 <b>담당자가 직접 확인</b>하고 있습니다. 영업일 1일 안에 연락드리며, 바로 확인을 원하시면 ${TEL} 로 연락 주세요.`,
          summary(d) + `<div class="btn-row"><a class="prime" href="/">홈으로</a>${telLink}</div>`);
        if (d.status === 'cancelled' || d.status === 'partialCancelled') return show('↩️', '취소된 결제입니다',
          `이 주문의 결제는 취소(환불) 처리되었습니다. 궁금한 점은 ${TEL} 로 연락 주세요.`,
          summary(d) + `<div class="btn-row"><a class="prime" href="/">홈으로</a>${telLink}</div>`);
        return notFound();
      }
      function notFound() {
        show('⚠️', '주문 정보를 찾지 못했습니다', `주소가 잘못되었거나 확인 기간이 지났습니다. 결제하셨다면 ${TEL} 로 연락 주세요.`,
          `<div class="btn-row"><a class="prime" href="/checkout">결제 페이지로</a>${telLink}</div>`);
      }
      load(0);
    </script>
  </body>
</html>
